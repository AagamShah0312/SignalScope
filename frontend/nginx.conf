server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API + visualization requests to the backend service.
    location /predict {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        client_max_body_size 16m;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /files/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
