# =============================================================================
# SignalScope — central configuration
# =============================================================================
# This file is the single source of truth for training, evaluation and
# inference. All modules load it through src/config.py (and app/config.py).
# -----------------------------------------------------------------------------

project:
  name: SignalScope
  version: "2.0.0"
  task: real_vs_ai_generated_image_classification
  description: "Telling Real From Synthetic in the Age of Generative Media"

data:
  image_size: 224
  num_classes: 2
  # 0 = REAL, 1 = AI_GENERATED  (kept consistent everywhere)
  labels:
    real: 0
    ai_generated: 1
  class_names: ["REAL", "AI_GENERATED"]

  # ---- dataset locations (relative to repo root) ----
  cifake_root: data/raw/cifake
  defactify_train_manifest: data/raw/defactify_train/manifest.csv
  defactify_eval_manifest: data/raw/defactify_eval/manifest.csv
  defactify_train_image_dir: data/raw/defactify_train/images
  manifest_dir: data/processed

  # ---- train / validation split ----
  validation_fraction: 0.10
  split_seed: 42

training:
  batch_size: 16
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw          # adamw | sgd
  num_workers: 2
  seed: 42
  # model selection criterion: val_auc | val_loss | val_macro_f1
  selection_metric: val_auc

  # ---- augmentation (applied only during training) ----
  augmentation:
    baseline: true          # Resize + flip + rotation + color jitter
    stronger: false         # adds JPEG compression, blur, noise
    jpeg_quality_low: 70
    blur_sigma: 0.5
    noise_std: 0.01

model:
  architecture: efficientnet_b0
  pretrained: true
  dropout: 0.2              # applied in the fusion head only (ignored for plain model)
  use_frequency_features: false
  # Soft-voting ensemble. The CIFAKE baseline specialises in detecting
  # synthetic imagery; the fine-tuned model specialises in not flagging real
  # photos.  Weights were chosen on the small public adaptation evaluation set
  # (see reports/real_photo_adaptation.md) and are provisional pending
  # full-scale CIFAKE+Defactify validation.
  ensemble:
    enabled: true
    members:
      - checkpoint: src/models/best_efficientnet_b0.pth
        weight: 0.3
      - checkpoint: src/models/fine_tuned_model.pth
        weight: 0.7

evaluation:
  # binary decision threshold for the official real-vs-AI score
  threshold: 0.5
  metrics:
    - roc_auc
    - macro_f1
    - accuracy
    - precision
    - recall
    - fpr
    - confusion_matrix

calibration:
  method: temperature_scaling   # temperature_scaling | none
  temperature: 1.0              # learned on validation; 1.0 == identity

inference:
  # responsible verdict policy on P(AI-generated):
  #   P >= high_threshold  -> likely_ai_generated
  #   P <= low_threshold   -> likely_real
  #   otherwise            -> inconclusive
  high_threshold: 0.80
  low_threshold: 0.20
  decision_threshold: 0.5
  device: auto            # auto | cpu | cuda
  max_upload_mb: 15

paths:
  model_dir: model
  reports_dir: reports
  experiments_dir: experiments/runs
  output_dir: output
  # Preferred production checkpoint. Resolution order (see src/models/model.py
  # resolve_checkpoint): this path -> model/best_model.pth ->
  # src/models/best_efficientnet_b0.pth (committed baseline fallback).
  checkpoint: src/models/fine_tuned_model.pth
